<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- house -->
  <g fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 246 L256 118 L408 246"/>
    <path d="M148 214 V398 H364 V214"/>
  </g>

  <!-- pi -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M192 262 H322"/>
    <path d="M226 264 C226 300 222 330 210 360"/>
    <path d="M290 264 V340 C290 356 300 362 316 356"/>
  </g>

  <!-- durable badge: resume arrow -->
  <circle cx="392" cy="392" r="84" fill="url(#badge)" stroke="#FFFFFF" stroke-width="14"/>
  <!-- clockwise arc from -60deg to 240deg, gap at the top, arrow head at the end -->
  <path d="M414 353.9 A44 44 0 1 1 370 353.9" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M389 343 L361 340 L378 368 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
</svg>
